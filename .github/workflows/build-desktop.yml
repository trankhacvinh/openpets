name: Build Desktop App

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.0.8 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build and package desktop app
        run: pnpm package:desktop

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openpets-desktop-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            apps/desktop/dist-electron/**
            apps/desktop/dist/**
            apps/desktop/release/**
            apps/desktop/out/**
            dist/**
            release/**
            out/**
            !**/node_modules/**
